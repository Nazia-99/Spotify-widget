<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="code-with-nazia.css">
</head>
<body>
    <div class="widget" id="widget">
 
        <!-- main black body: SVG so the top-right curve is smooth -->
        <svg class="body" viewBox="0 0 765 618" aria-hidden="true">
          <path fill="#161616" d="M0,60 A60,60 0 0 1 60,0 L398,0 C435,0 450,25 468,58 C490,100 510,131 570,131 L707,131 A58,58 0 0 1 765,189 L765,558 A60,60 0 0 1 705,618 L60,618 A60,60 0 0 1 0,558 Z"/>
        </svg>
       
        <!-- brand -->
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#04ff74"/>
          <path d="M5.2 8.7Q12 6.5 18.8 9.7" stroke="#161616" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <path d="M6 12.4Q12 10.7 17.9 13.1" stroke="#161616" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M6.8 15.9Q12 14.6 16.9 16.4" stroke="#161616" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="wordmark">Spotify<sup>®</sup></div>
       
        <!-- separate time tab -->
        <svg class="time-bg" viewBox="0 0 765 618" aria-hidden="true">
          <path fill="#04ff74" d="M420,50 L638,50 A75,70 0 0 1 713,120 L713,145 L420,145 Z"/>
        </svg>
        <div class="time-tab"><span>6:46<small>PM</small></span></div>
       
        <!-- glass card -->
        <div class="card">
          <img class="cover" src="cover.jpg" alt="Album cover">
          <div class="new">• NEW RELEASE</div>
          <svg class="check" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#04ff74"/><path d="M9 16.5l4.8 4.8L23 11.5" stroke="#161616" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="lyrics"><div class="track"></div></div>
        </div>
       
        <h2 class="title">Lost in the Fire</h2>
        <p class="artist">Gesaffelstein feat. The Weeknd</p>
       
        <div class="progress"><div class="bar"><i></i></div></div>
        <div class="t t-now">1:14</div>
        <div class="t t-total">3:22</div>
       
        <button class="ctl prev" aria-label="Previous">
          <svg viewBox="0 0 48 48"><rect x="0" y="2" width="8" height="44" rx="2"/><path d="M45 6v36L12 24z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
        </button>
        <button class="ctl play" aria-label="Pause">
          <svg viewBox="0 0 74 74"><rect x="25" y="22" width="10" height="30" rx="3"/><rect x="40" y="22" width="10" height="30" rx="3"/></svg>
        </button>
        <button class="ctl next" aria-label="Next">
          <svg viewBox="0 0 48 48"><rect x="40" y="2" width="8" height="44" rx="2"/><path d="M3 6v36l33-18z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
        </button>
      </div>
      

<script>
/* scale the fixed 765px widget down on small screens */
function fit(){var s=Math.min(1,(innerWidth-32)/765);document.getElementById('widget').style.setProperty('--s',s)}
addEventListener('resize',fit);fit();

(function () {
  var total = 202;      // 3:22 in seconds
  var t = 74;           // start at 1:14
  var playing = true;
  var STEP = 4;         // seconds per lyric line
  var LH = 32;          // line height in px (same as CSS)

  var $ = function (s) { return document.querySelector(s); };
  var track = $('.lyrics .track');

  // placeholder lines (replace with your own text)
  var lines = [
    "I can’t lose you, babe",
    "I can’t lose you, babe",
    "Lost in the fire",
    "Lost in the fire",
    "Take me over",
    "I can’t lose you, babe"
  ];

  // one <p> per step so the track only ever scrolls forward
  var count = Math.ceil(total / STEP) + 1, els = [];
  for (var k = 0; k < count; k++) {
    var p = document.createElement('p');
    p.className = 'l';
    p.textContent = lines[k % lines.length];
    track.appendChild(p);
    els.push(p);
  }
  var current = -1;

  var pauseIcon = '<rect x="25" y="22" width="10" height="30" rx="3"/><rect x="40" y="22" width="10" height="30" rx="3"/>';
  var playIcon  = '<path d="M29 21v32l26-16z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>';

  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  function setLine(i) {
    if (i === current) return;
    current = i;
    track.style.transform = 'translateY(' + ((1 - i) * LH) + 'px)';
    els.forEach(function (el, k) {
      el.classList.toggle('on', k === i);
      el.classList.toggle('near', Math.abs(k - i) === 1);
    });
  }

  function render() {
    $('.bar i').style.width = (t / total * 100) + '%';
    $('.t-now').textContent = fmt(t);
    setLine(Math.floor(t / STEP));
  }

  $('.play').addEventListener('click', function () {
    playing = !playing;
    this.querySelector('svg').innerHTML = playing ? pauseIcon : playIcon;
  });

  $('.progress').addEventListener('click', function (e) {
    var r = this.getBoundingClientRect();
    t = Math.round((e.clientX - r.left) / r.width * total);
    render();
  });

  setInterval(function () {
    if (playing) { t = (t + 1) % total; render(); }
  }, 1000);

  render();
})();
</script>
</body>
</html>
